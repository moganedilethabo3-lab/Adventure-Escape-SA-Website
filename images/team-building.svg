<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Sky -->
  <rect width="400" height="300" fill="#87CEEB"/>
  <!-- Grass -->
  <polygon points="0,200 400,200 400,300 0,300" fill="#3d8b40"/>
  <!-- Team members in circle -->
  <circle cx="80" cy="150" r="12" fill="#FFD700"/>
  <rect x="76" y="165" width="8" height="15" fill="#FF6B6B"/>
  
  <circle cx="150" cy="100" r="12" fill="#FFD700"/>
  <rect x="146" y="115" width="8" height="15" fill="#0066CC"/>
  
  <circle cx="220" cy="120" r="12" fill="#FFD700"/>
  <rect x="216" y="135" width="8" height="15" fill="#FF6B6B"/>
  
  <circle cx="280" cy="160" r="12" fill="#FFD700"/>
  <rect x="276" y="175" width="8" height="15" fill="#0066CC"/>
  
  <circle cx="200" cy="200" r="12" fill="#FFD700"/>
  <rect x="196" y="215" width="8" height="15" fill="#FF6B6B"/>
  
  <!-- Connecting lines showing teamwork -->
  <line x1="80" y1="150" x2="150" y2="100" stroke="#333" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
  <line x1="150" y1="100" x2="220" y2="120" stroke="#333" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
  <line x1="220" y1="120" x2="280" y2="160" stroke="#333" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
  <line x1="280" y1="160" x2="200" y2="200" stroke="#333" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
  <line x1="200" y1="200" x2="80" y2="150" stroke="#333" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
  
  <!-- Sun -->
  <circle cx="350" cy="30" r="25" fill="#FFD700"/>
</svg>
