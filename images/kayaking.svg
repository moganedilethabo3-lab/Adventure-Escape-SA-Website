<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="150" fill="#87CEEB"/>
  <!-- Water -->
  <rect y="150" width="400" height="150" fill="url(#waterGrad)"/>
  <!-- Sun -->
  <circle cx="350" cy="40" r="30" fill="#FFD700"/>
  <!-- Kayaks -->
  <ellipse cx="100" cy="180" rx="35" ry="15" fill="#FF6B6B"/>
  <ellipse cx="100" cy="180" rx="30" ry="10" fill="#FF8787" opacity="0.8"/>
  <line x1="75" y1="180" x2="75" y2="195" stroke="#333" stroke-width="1"/>
  <line x1="125" y1="180" x2="125" y2="195" stroke="#333" stroke-width="1"/>
  <ellipse cx="280" cy="200" rx="35" ry="15" fill="#FFA500"/>
  <ellipse cx="280" cy="200" rx="30" ry="10" fill="#FFB84D" opacity="0.8"/>
  <line x1="255" y1="200" x2="255" y2="215" stroke="#333" stroke-width="1"/>
  <line x1="305" y1="200" x2="305" y2="215" stroke="#333" stroke-width="1"/>
  <!-- Mountains in background -->
  <polygon points="0,150 100,80 200,150" fill="#8B6F47"/>
  <polygon points="200,150 300,60 400,150" fill="#A0826D"/>
  <!-- Water ripples -->
  <circle cx="150" cy="220" r="15" fill="none" stroke="#87CEEB" stroke-width="1" opacity="0.5"/>
  <circle cx="350" cy="240" r="12" fill="none" stroke="#87CEEB" stroke-width="1" opacity="0.5"/>
</svg>
