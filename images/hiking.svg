<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#skyGrad)"/>
  <!-- Mountains -->
  <polygon points="0,180 150,50 300,180" fill="#8B6F47"/>
  <polygon points="100,180 250,70 400,180" fill="#A0826D"/>
  <!-- Snow caps -->
  <polygon points="150,50 140,80 160,80" fill="#FFF"/>
  <polygon points="250,70 240,100 260,100" fill="#FFF"/>
  <!-- Hiking path -->
  <path d="M 150 140 Q 160 120 170 130 T 190 120" stroke="#654321" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Hiker -->
  <circle cx="185" cy="115" r="4" fill="#333"/>
  <rect x="182" y="120" width="6" height="8" fill="#FF6B6B"/>
  <line x1="182" y1="128" x2="180" y2="135" stroke="#333" stroke-width="2"/>
  <line x1="188" y1="128" x2="190" y2="135" stroke="#333" stroke-width="2"/>
  <!-- Trees -->
  <line x1="200" y1="140" x2="200" y2="160" stroke="#654321" stroke-width="2"/>
  <polygon points="200,130 190,145 210,145" fill="#2d5016"/>
  <line x1="250" y1="155" x2="250" y2="175" stroke="#654321" stroke-width="2"/>
  <polygon points="250,145 240,160 260,160" fill="#2d5016"/>
</svg>
