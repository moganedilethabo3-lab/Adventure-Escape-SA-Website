  <line x1="136" y1="189" x2="134" y2="200" stroke="#333" stroke-width="1"/>
  <line x1="144" y1="189" x2="146" y2="200" stroke="#333" stroke-width="1"/>
  
  <!-- Student 3 -->
  <circle cx="200" cy="160" r="10" fill="#FFD700"/>
