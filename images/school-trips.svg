<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Sky -->
  <rect width="400" height="200" fill="#87CEEB"/>
  <!-- Mountains -->
  <polygon points="0,200 100,100 200,200" fill="#8B6F47"/>
  <polygon points="150,200 280,80 400,200" fill="#A0826D"/>
  <!-- Ground -->
  <polygon points="0,200 400,200 400,300 0,300" fill="#90EE90"/>
  
  <!-- Group of students -->
  <!-- Student 1 -->
  <circle cx="80" cy="170" r="10" fill="#FFD700"/>
  <rect x="76" y="182" width="8" height="12" fill="#FF6B6B"/>
  <line x1="76" y1="194" x2="74" y2="205" stroke="#333" stroke-width="1"/>
  <line x1="84" y1="194" x2="86" y2="205" stroke="#333" stroke-width="1"/>
  
  <!-- Student 2 -->
  <circle cx="140" cy="165" r="10" fill="#FFD700"/>
