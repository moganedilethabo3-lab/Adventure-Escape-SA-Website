  <!-- Student 5 -->
  <circle cx="320" cy="175" r="10" fill="#FFD700"/>
  <rect x="316" y="187" width="8" height="12" fill="#FF6B6B"/>
  <line x1="316" y1="199" x2="314" y2="210" stroke="#333" stroke-width="1"/>
  <line x1="324" y1="199" x2="326" y2="210" stroke="#333" stroke-width="1"/>
  
  <!-- Teacher -->
  <circle cx="170" cy="140" r="11" fill="#FFD700"/>
